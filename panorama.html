const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdedcd8);
const camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,100);
const HARC=273*Math.PI/180, VARC=112*Math.PI/180;
const geo=new THREE.SphereGeometry(30,80,48,0,HARC,(Math.PI-VARC)/2,VARC);
const img=new Image();
img.onload=function(){
  const tex=new THREE.Texture(img); tex.needsUpdate=true;
  tex.minFilter=THREE.LinearFilter;
  const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide});
  const sph=new THREE.Mesh(geo,mat);
  sph.scale.x=-1;
  sph.rotation.y=Math.PI+HARC/2-2.18; // 正面=パノラマ中央(窓)
  scene.add(sph);
};
img.src=PANO;
let yaw=0,pitch=0,drag=false,px=0,py=0,fov=70,lastPinch=0;
const ptrs=new Map();
function pinchDist(){const a=[];ptrs.forEach(function(v){a.push(v);});return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
const YMAX=112*Math.PI/180, PMAX=0.62;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',function(e){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){lastPinch=pinchDist();drag=false;return;}
  drag=true;px=e.clientX;py=e.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',function(e){ptrs.delete(e.pointerId);lastPinch=0;drag=false;cv.style.cursor='grab';});
cv.addEventListener('pointercancel',function(e){ptrs.delete(e.pointerId);lastPinch=0;drag=false;});
cv.addEventListener('pointermove',function(e){
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const d=pinchDist();
    if(lastPinch>0){fov=Math.max(35,Math.min(95,fov/(d/lastPinch)));camera.fov=fov;camera.updateProjectionMatrix();}
    lastPinch=d; return;
  }
  if(!drag)return;
  yaw=Math.max(-YMAX,Math.min(YMAX,yaw-(e.clientX-px)*0.0032));
  pitch=Math.max(-PMAX,Math.min(PMAX,pitch+(e.clientY-py)*0.0025));
  px=e.clientX;py=e.clientY;
});
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  fov=Math.max(35,Math.min(95,fov+e.deltaY*0.04));
  camera.fov=fov;camera.updateProjectionMatrix();
},{passive:false});
function loop(){
  requestAnimationFrame(loop);
  camera.lookAt(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
  renderer.render(scene,camera);
}
loop();
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
